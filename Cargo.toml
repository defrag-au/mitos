# mitos — a framework for composing Cardano indexers as Rust modules
# that share a single in-process chain data plane (Dolos).
#
# Name: from Greek μίτος, "thread" — Theseus's thread through the
# Labyrinth. Each indexer is one thread of meaning pulled from the chain;
# a bundle weaves them together for an application.
#
# Sits in the txpipe-adjacent Greek-mythology naming neighbourhood
# (Dolos / Pallas / Balius / Mithril).

[workspace]
members = [
    "crates/mitos-protocol",
    "crates/mitos-data-plane",
    "crates/mitos-platform",
    "crates/mitos-core",
    "crates/mitos-companion",
    "crates/mitos-community-events",
    "crates/mitos-module-kit",
    "crates/mitos-dex-decode",
    "crates/mitos-vesting-decode",
    "crates/mitos-marketplace-decode",
    "crates/market-ledger-wire",
    "crates/none-match-indexer",
    "bundles/default",
    "tools/capture-block",
    "tools/diff-collection-ownership",
    "tools/mitos-tail",
    "tools/mitos-admin",
    "tools/mitos-build",
    "tools/mitos-run",
    "tools/mitos-chain-walk",
    "tools/market-ledger",
    "tools/project-ledger",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Damon Oehlman <damon.oehlman@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Dolos as embedded data plane. Pinned to a tag for reproducibility;
# bump deliberately and audit the diff (see docs/design/ROADMAP.md).
# v1.2.0 brings the van Rossem fork / protocol-v11 support (#990) — fixes the
# `roll/dreps.rs` sync panic that crash-looped older builds once preprod crossed
# the governance fork. NOTE: it also versions the WAL on-disk schema and
# force-resets on incompatibility (#984) — expect a dolos RESYNC on first run.
dolos = { git = "https://github.com/txpipe/dolos", tag = "v1.2.0" }
dolos-core = { git = "https://github.com/txpipe/dolos", tag = "v1.2.0" }
dolos-cardano = { git = "https://github.com/txpipe/dolos", tag = "v1.2.0" }
dolos-redb3 = { git = "https://github.com/txpipe/dolos", tag = "v1.2.0" }
dolos-fjall = { git = "https://github.com/txpipe/dolos", tag = "v1.2.0" }
dolos-minibf = { git = "https://github.com/txpipe/dolos", tag = "v1.2.0" }
# CARE: the transitive `utxorpc-spec` is pinned to 0.19.0 in Cargo.lock. dolos
# v1.2.0's gRPC `v1beta/watch` builds against 0.19.0, but 0.19.2 made
# `asset_name`/`policy_id` `Option<Bytes>` (a breaking change within the 0.19 line)
# and won't compile dolos. A broad `cargo update` will re-bump it — if dolos fails
# to build on a transitive update, re-pin with
# `cargo update -p utxorpc-spec --precise 0.19.0`.

# Cardano types + parsing. ONE pallas across mitos + the embedded dolos — they
# share types at the follower boundary, so the lockfile must unify a single
# version. dolos v1.2.0 asks for `pallas = "1.0.0"` (a caret range), so 1.1.1
# unifies and dolos compiles against it unchanged. `unstable` mirrors dolos's
# own feature set (dolos uses ["hardano", "phase2", "unstable"]); kept for
# parity, harmless otherwise.
#
# BUMPED 1.0.0 → 1.1.1 (2026-08-16) so shared-crates can be consumed from the
# sibling tree via the [patch] block below: shared-crates moved to pallas 1.1.1,
# and the `pallas` umbrella pins every sub-crate `=<its own version>`, so a
# 1.0.0 umbrella here made `pallas-codec ^1.1.1` unresolvable.
#
# The bump is close to a no-op by construction: pallas 1.1.1's sources are
# BYTE-IDENTICAL to 1.0.0 for every crate this tree uses (addresses, codec,
# crypto, hardano, primitives, traverse). The sole difference in the whole
# family is `pallas-network`'s `localmsgsubmission` mini-protocol — which
# nothing here references, and whose public API is unchanged.
#
# NOTE: this does NOT add a "van Rossem" block era. pallas-traverse's era probe
# (`probe::block_era`) tops out at Conway (tag 7) in EVERY released version
# incl. 1.1.0 / `main` — there is no era-8 variant in the `Era` enum anywhere.
# So van Rossem / protocol v11 is an intra-Conway protocol bump, not a new
# ledger era; a `MultiEraBlock decode: Unknown CBOR structure` on a follower
# block means the probe went `Inconclusive` (the bytes aren't a complete block
# wrapper, e.g. a divergent / reseed-only WAL tip), NOT an unknown era — chase
# the chain/state, not the pallas version.
pallas = { version = "1.1.1", features = ["unstable"] }
pallas-addresses = "1.1.1"
pallas-codec = "1.1.1"
pallas-primitives = "1.1.1"
pallas-traverse = { version = "1.1.1", features = ["unstable"] }
# Immutable-DB (cardano-node / Mithril snapshot) chunk reader — the
# `market-ledger` walker iterates certified history from plain chunk files
# (`storage::immutable::read_blocks`). Not enabled via pallas's `hardano`
# feature (mitos's pallas is `unstable`-only), so depend on it directly.
pallas-hardano = "1.1.1"
# N2N chainsync/blockfetch client for market-ledger's `follow` tip tail
# (self-contained — see MARKET_LEDGER.md "Follow mode"). Same pin as the rest
# of the family; the only crate whose 1.1.1 sources differ from 1.0.0, and only
# in `localmsgsubmission` (unused here).
pallas-network = "1.1.1"

# Asset handling — typed AssetId, PolicyId, Fingerprint (CIP-14),
# TokenType, asset-name decoders. Shared with cnft.dev-workers.
# Pinned to a specific shared-crates rev for reproducibility; bump
# deliberately when shared-crates lands changes mitos needs.
cardano-assets = { git = "https://github.com/defrag-au/shared-crates", rev = "d7dbe4d21a2a63ebd3c0079f41066516ed2b27fc", features = ["cip14", "cip25"] }
# Pipeline shared types (`PricedAsset`, `OperationPayload`) — used
# by the protocol-event taxonomy in `mitos-core::protocol`. Same
# shape the existing classifier emits, so mitos events deserialize
# identically on the CF side.
pipeline-types = { git = "https://github.com/defrag-au/shared-crates", rev = "d7dbe4d21a2a63ebd3c0079f41066516ed2b27fc" }
# Pure, I/O-free wallet-flow model (`TxView`/`net_deltas`/`movements`) + the
# project-walk `frontier` state machine. Consumed by `tools/project-ledger`.
chain-ledger = { git = "https://github.com/defrag-au/shared-crates", rev = "d7dbe4d21a2a63ebd3c0079f41066516ed2b27fc" }

# Async runtime + HTTP server.
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "ws"] }
tower = "0.5"
# Response layers for the market-ledger read surface (gzip + CORS for
# browser/WASM consumers behind a CF tunnel).
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip", "cors"] }

# Compact positional wire encoding for market-ledger-wire. Same pin as
# cnft.dev-workers (registry-index blob) so the two trees agree on the format.
postcard = { version = "1", features = ["use-std"] }

# Serialization + logging + errors.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
hex = "0.4"

# Storage backend for indexer materialized views (separate from Dolos's
# state store — each indexer owns its own view).
redb = "2"

# Embedded sqlite for the market-ledger walker's operational ledger. `bundled`
# compiles sqlite from source (on-box build, no system dep).
rusqlite = { version = "0.32", features = ["bundled"] }

# Concurrent map for the dispatcher's per-Apply claim coordinator
# (residual pass — see `docs/design/DOMAIN_REFACTOR.md`). Lock-free
# insertion avoids contention when specific-domain indexers run in
# parallel and add claims for the same tx.
dashmap = "6"

# CLI / config.
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.14", default-features = false, features = ["toml"] }

# HTTP client for the diff harness (polls both workers' read APIs).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# --- Patch overrides ---
#
# CURRENTLY ACTIVE (2026-08-16) — consuming the sibling tree at
# `../shared-crates`.
# **RE-COMMENT THE WHOLE BLOCK BEFORE COMMIT** so CI uses the git revs.
#
# Toggle the block as a UNIT, never line by line: a selective edit either
# duplicates a key (if a line ends up both active and commented) or breaks an
# unrelated crate (if something transitively required is left commented).
#
# One entry per shared-crate the workspace ACTUALLY depends on — a patch for a
# crate no member uses is dead weight that cargo reports on every build
# ("patch ... was not used in the crate graph"). `transactions`, `tx-classifier`
# and `address-registry` were removed on 2026-08-16: their only consumer was the
# in-tree `marketplace-indexer`, retired in 6a2f2a7 (May 2026), so they had been
# dead for three months. Re-add alongside the matching `[workspace.dependencies]`
# entry if a member needs one again.
#
# This block was un-usable until the pallas 1.1.1 bump above: shared-crates
# moved to pallas 1.1.1 and the `pallas` umbrella pins its sub-crates `=`, so a
# 1.0.0 umbrella here made the local `cardano-assets` unresolvable.
#
# Both states are verified to build: ACTIVE (local paths) and COMMENTED (the
# pinned git revs). Keep it that way — the commented state is what CI sees.
[patch."https://github.com/defrag-au/shared-crates"]
# cardano-assets = { path = "../shared-crates/cardano-assets" }
# pipeline-types = { path = "../shared-crates/pipeline/pipeline-types" }
# chain-ledger = { path = "../shared-crates/chain-ledger" }
