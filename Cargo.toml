# mitos — a framework for composing Cardano indexers as Rust modules
# that share a single in-process chain data plane (Dolos).
#
# Name: from Greek μίτος, "thread" — Theseus's thread through the
# Labyrinth. Each indexer is one thread of meaning pulled from the chain;
# a bundle weaves them together for an application.
#
# Sits in the txpipe-adjacent Greek-mythology naming neighbourhood
# (Dolos / Pallas / Balius / Mithril).

[workspace]
members = [
    "crates/mitos-protocol",
    "crates/mitos-core",
    "crates/jpg-co-indexer",
    "crates/collection-ownership-indexer",
    "crates/marketplace-indexer",
    "bundles/default",
    "tools/diff-collection-ownership",
    "tools/mitos-tail",
    "tools/mitos-admin",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Damon Oehlman <damon.oehlman@gmail.com>"]
license = "Apache-2.0"

[workspace.dependencies]
# Dolos as embedded data plane. Pinned to a tag for reproducibility;
# bump deliberately and audit the diff (see docs/design/ROADMAP.md).
dolos = { git = "https://github.com/txpipe/dolos", tag = "v1.0.3" }
dolos-core = { git = "https://github.com/txpipe/dolos", tag = "v1.0.3" }
dolos-cardano = { git = "https://github.com/txpipe/dolos", tag = "v1.0.3" }
dolos-redb3 = { git = "https://github.com/txpipe/dolos", tag = "v1.0.3" }
dolos-fjall = { git = "https://github.com/txpipe/dolos", tag = "v1.0.3" }

# Cardano types + parsing. Same pallas version Dolos uses.
pallas = "1.0.0-alpha.3"
pallas-addresses = "1.0.0-alpha.3"
pallas-codec = "1.0.0-alpha.3"
pallas-primitives = "1.0.0-alpha.3"
pallas-traverse = "1.0.0-alpha.3"

# Asset handling — typed AssetId, PolicyId, Fingerprint (CIP-14),
# TokenType, asset-name decoders. Shared with cnft.dev-workers.
# Pinned to a specific shared-crates rev for reproducibility; bump
# deliberately when shared-crates lands changes mitos needs.
cardano-assets = { git = "https://github.com/defrag-au/shared-crates", rev = "80601b906db5e0201085ccf9fb0639ed3e746b97", features = ["cip14"] }
# Pipeline shared types (`PricedAsset`, `OperationPayload`) — used
# by the protocol-event taxonomy in `mitos-core::protocol`. Same
# shape the existing classifier emits, so mitos events deserialize
# identically on the CF side.
pipeline-types = { git = "https://github.com/defrag-au/shared-crates", rev = "80601b906db5e0201085ccf9fb0639ed3e746b97" }
# Pipeline transaction shape (`RawTxData`) + the `pallas-adapter`
# helpers that convert pallas `MultiEraTx` + resolved inputs into
# `RawTxData`. The marketplace indexer feeds this into the
# classifier's `RuleEngine` to decode sales / listings / offers.
transactions = { git = "https://github.com/defrag-au/shared-crates", rev = "80601b906db5e0201085ccf9fb0639ed3e746b97", features = ["pallas-adapter"] }
# Marketplace classification (`RuleEngine::classify(&RawTxData) -> TxClassification`).
# Default features only — the `indexers` feature pulls in CF
# Workers / Maestro deps that mitos doesn't want.
tx-classifier = { git = "https://github.com/defrag-au/shared-crates", rev = "80601b906db5e0201085ccf9fb0639ed3e746b97" }
# Same git source for shared sub-deps the classifier itself uses;
# pinning here keeps the lockfile from picking up multiple
# revisions of shared-crates.
address-registry = { git = "https://github.com/defrag-au/shared-crates", rev = "80601b906db5e0201085ccf9fb0639ed3e746b97" }

# Async runtime + HTTP server.
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "ws"] }
tower = "0.5"

# Serialization + logging + errors.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
hex = "0.4"

# Storage backend for indexer materialized views (separate from Dolos's
# state store — each indexer owns its own view).
redb = "2"

# CLI / config.
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.14", default-features = false, features = ["toml"] }

# HTTP client for the diff harness (polls both workers' read APIs).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# --- Patch overrides ---
#
# During shared-crates `damon-mitos-improvements` development,
# point at a local checkout. Removed once the typed newtypes /
# pallas-adapter / classify_raw work lands on shared-crates main
# and a new revision is pinned in [workspace.dependencies] above.
#
# Convention: shared-crates is a sibling repo at `../shared-crates`.
# Adjust the path locally if your layout differs.
[patch."https://github.com/defrag-au/shared-crates"]
cardano-assets = { path = "../shared-crates/cardano-assets" }
pipeline-types = { path = "../shared-crates/pipeline/pipeline-types" }
transactions = { path = "../shared-crates/pipeline/transactions" }
tx-classifier = { path = "../shared-crates/pipeline/tx-classifier" }
address-registry = { path = "../shared-crates/address-registry" }

