name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    types: [opened, synchronize]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ----------------------------------------------------------------
  # Workspace lint / format / test on the native target. Covers
  # `mitos-platform`, `mitos-core`, `mitos-data-plane`, the in-tree
  # indexers, and tooling (`mitos-build`, `mitos-run`, `mitos-admin`,
  # `capture-block`, `mitos-tail`). Community-module wasm builds
  # land in the separate `community-modules` job further down.
  # ----------------------------------------------------------------
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features

  # ----------------------------------------------------------------
  # Community-module wasm artifacts + golden test suite.
  #
  # Same flow as `scripts/deploy.sh` does on the box (build
  # mitos-build, run it for each `community-modules/<name>/<name>.rs`,
  # then assert via `scripts/run-golden-tests.sh`). Catches:
  #   - wasm-target build failures
  #   - module ABI / manifest drift
  #   - emission-shape changes that would fail golden assertions
  #   - non-deterministic emission order
  #
  # `wasm32-wasip2` is the canonical target for mitos platform-v2
  # modules. `wasm32-unknown-unknown` (the typical CF-worker target)
  # is NOT used here — that's a different ABI surface.
  # ----------------------------------------------------------------
  community-modules:
    name: Community Modules + Golden Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "community-modules"
          cache-on-failure: true
          # Default rust-cache scope covers `~/.cargo/{registry,git}`
          # and the top-level `target/`. Each community module
          # materialises its wasm crate at
          # `community-modules/<name>/target/mitos-build/<name>/`
          # with its own private `target/` dir, none of which the
          # default scope sees. Without explicit `cache-directories`
          # entries every CI run rebuilds each module's wasm deps
          # (pallas-*, serde, ciborium, …) from scratch.
          cache-directories: |
            community-modules/asset-metadata-update/target
            community-modules/asset-transfer/target
            community-modules/burn-address/target
            community-modules/cip-25-mint/target
            community-modules/cip-68-mint/target
            community-modules/holder-distribution/target
            community-modules/jpg-store-listing/target
            community-modules/jpg-store-offer/target
            community-modules/jpg-store-sale/target
            community-modules/standard-burn/target
            community-modules/vesting-tracker/target

      - name: Build host tools (mitos-build + mitos-run)
        run: cargo build --release -p mitos-build -p mitos-run

      - name: Build community-module wasm artifacts
        # `MITOS_BUILD_FAST=1` switches every materialised module's
        # `[profile.release]` to a CI-friendly profile (no LTO,
        # 16 codegen units, `opt-level = 1`). Default release
        # profile (`lto = true`, `codegen-units = 1`,
        # `opt-level = "z"`) is correct for prod deploys but
        # dominates CI wall time; fast artifacts produce identical
        # event emissions so goldens stay green.
        #
        # `xargs -P "$(nproc)"` runs the per-module builds in
        # parallel up to the runner's core count. Each module's
        # target dir is independent so there's no write
        # contention. On warm-cache incremental builds (the
        # common case once caching is established) cross-module
        # parallelism wins outright; on cold-cache full rebuilds
        # cargo's internal codegen-unit parallelism would already
        # saturate cores, so the cross-module dimension is
        # net-neutral rather than a slowdown — Linux's scheduler
        # handles the oversubscription.
        env:
          MITOS_BUILD_FAST: "1"
        run: |
          set -euo pipefail
          modules=()
          for d in community-modules/*/; do
            name=$(basename "$d")
            stem=$(echo "$name" | tr - _)
            src="${d}${stem}.rs"
            if [ ! -f "$src" ]; then
              echo "skip $name: no $stem.rs"
              continue
            fi
            modules+=("$src")
          done
          printf '%s\n' "${modules[@]}" \
            | xargs -P "$(nproc)" -I {} ./target/release/mitos-build --module {}

      - name: Run golden tests
        run: ./scripts/run-golden-tests.sh
