name: CI

on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    types: [opened, synchronize]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ----------------------------------------------------------------
  # Fast-fail gate. fmt is seconds; everything heavy hangs off it so
  # a formatting miss short-circuits the run before we spend runner
  # minutes on clippy / test / wasm builds.
  # ----------------------------------------------------------------
  fmt:
    name: Fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ----------------------------------------------------------------
  # Workspace lint / test on the native target. Run in parallel with
  # `host-tools` (below) once `fmt` is green — covers `mitos-platform`,
  # `mitos-core`, `mitos-data-plane`, the in-tree indexers, and tooling.
  # ----------------------------------------------------------------
  clippy:
    name: Clippy
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
          cache-on-failure: true
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --all-features

  # ----------------------------------------------------------------
  # Native host tools (mitos-build + mitos-run), published as
  # artifacts. Split out of `community-modules` so it:
  #   - runs in PARALLEL with clippy/test (was serial, behind
  #     `needs: [test]`), and
  #   - is compiled ONCE and reused — `community-modules` downloads
  #     the binaries instead of recompiling them.
  # Own cache scope so the native tool build doesn't churn the wasm
  # job's cache (different target triple / deps).
  # ----------------------------------------------------------------
  host-tools:
    name: Host Tools
    needs: [fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "host-tools"
          cache-on-failure: true
      - name: Build mitos-build + mitos-run
        run: cargo build --release -p mitos-build -p mitos-run
      - name: Upload host tools
        uses: actions/upload-artifact@v4
        with:
          name: host-tools
          path: |
            target/release/mitos-build
            target/release/mitos-run
          retention-days: 1
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Community-module wasm artifacts + golden test suite.
  #
  # Depends ONLY on `host-tools` (which gates on `fmt`), NOT on `test`
  # — so the slow per-module wasm builds start as soon as the tools
  # are ready, overlapping clippy/test instead of waiting them out.
  # Downloads the prebuilt mitos-build/mitos-run rather than
  # recompiling. Catches: wasm-target build failures, module ABI /
  # manifest drift, emission-shape changes that fail goldens, and
  # non-deterministic emission order.
  #
  # `wasm32-wasip2` is the canonical platform-v2 module target.
  # ----------------------------------------------------------------
  community-modules:
    name: Community Modules + Golden Tests
    needs: [host-tools]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "community-modules"
          cache-on-failure: true
          # Each module materialises its wasm crate at
          # `community-modules/<name>/target/mitos-build/<name>/` with
          # its own private `target/` the default rust-cache scope
          # doesn't see. The glob covers EVERY module (incl. new ones
          # like credit-address) so the wasm deps (pallas-*, serde,
          # ciborium, …) stay cached without hand-maintaining a list.
          cache-directories: |
            community-modules/*/target

      - name: Download host tools
        uses: actions/download-artifact@v4
        with:
          name: host-tools
          path: target/release

      - name: Restore exec bit
        # upload-artifact zips files and drops the +x bit; restore it
        # so the downloaded binaries are runnable.
        run: chmod +x target/release/mitos-build target/release/mitos-run

      - name: Build community-module wasm artifacts
        # `MITOS_BUILD_FAST=1` switches every materialised module's
        # `[profile.release]` to a CI-friendly profile (no LTO,
        # 16 codegen units, `opt-level = 1`) — identical event
        # emissions, far less wall time than the prod profile.
        #
        # `xargs -P "$(nproc)"` runs the per-module builds in parallel
        # up to the runner's core count; each module's target dir is
        # independent so there's no write contention.
        env:
          MITOS_BUILD_FAST: "1"
        run: |
          set -euo pipefail
          modules=()
          for d in community-modules/*/; do
            name=$(basename "$d")
            stem=$(echo "$name" | tr - _)
            src="${d}${stem}.rs"
            if [ ! -f "$src" ]; then
              echo "skip $name: no $stem.rs"
              continue
            fi
            modules+=("$src")
          done
          printf '%s\n' "${modules[@]}" \
            | xargs -P "$(nproc)" -I {} ./target/release/mitos-build --module {}

      - name: Run golden tests
        run: ./scripts/run-golden-tests.sh
