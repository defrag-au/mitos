# mitos.toml — module config for the jpg-co indexer.
#
# Read by `mitos-build`, CBOR-encoded into the artifact's
# `config.cbor`, uploaded alongside the wasm by `mitos-admin
# upload-module`, and passed to the module's `init(config)` on
# host follower start.

# Opt into the v2 platform ABI — `mitos-module-v2` world,
# eUTXO event-stream dispatch. v1 was block-centric and made
# every module re-implement bootstrap + per-output filtering;
# v2 hands modules a typed `handle-events` stream filtered
# against their declared interest set. See
# `mitos/docs/strategy/MITOS_PLATFORM_V2.md`.
abi_version = 2

# jpg.store CO script address — V2 (active per the existing
# `cardano-tx::collection_offer` builder; same payment-script
# hash as V3, different stake credential).
v2_address = "addr1xxgx3far7qygq0k6epa0zcvcvrevmn0ypsnfsue94nsn3tfvjel5h55fgjcxgchp830r7h2l5msrlpt8262r3nvr8eks2utwdd"

# jpg.store CO script address — V3 (deprecated but still
# indexed because pre-existing offers may sit there; same
# payment-script hash as V2, different stake credential).
v3_address = "addr1xxzvcf02fs5e282qk3pmjkau2emtcsj5wrukxak3np90n2evjel5h55fgjcxgchp830r7h2l5msrlpt8262r3nvr8eksg6pw3p"

# Platform-side interest declaration. mitos-build copies this
# block into `manifest.toml`; on first deploy the v2
# bootstrap orchestrator scans these addresses, synthesises
# events for every unspent CO output, and dispatches them
# through `handle-events` so the companion DO is hydrated
# from current chain state. Subsequent restarts skip already-
# bootstrapped addresses via per-address state-kv flags.
[interest]
addresses = [
    "addr1xxgx3far7qygq0k6epa0zcvcvrevmn0ypsnfsue94nsn3tfvjel5h55fgjcxgchp830r7h2l5msrlpt8262r3nvr8eks2utwdd",
    "addr1xxzvcf02fs5e282qk3pmjkau2emtcsj5wrukxak3np90n2evjel5h55fgjcxgchp830r7h2l5msrlpt8262r3nvr8eksg6pw3p",
]

# Module-side build dependencies. mitos-build appends these to
# the materialised crate's `[dependencies]` block; path entries
# are resolved relative to this `<name>.toml` file. Stripped
# from the CBOR'd runtime config so the module's `init` doesn't
# see them.
[deps]
# Wire-format event types — single source of truth shared with
# the companion DO at
# `cnft.dev-workers/workers/jpg-store-mirror/src/`. Lives in
# `mitos-community-events::jpg_co`; this module + the companion
# decode against the same definition.
mitos-community-events = { path = "../../crates/mitos-community-events" }
# PlutusData decoder for parsing CO datum CBOR. The shape we
# decode mirrors the encoder at
# `shared-crates/cardano-tx/src/builder/collection_offer.rs`
# (`build_co_datum`).
pallas-primitives = "1.0.0-alpha.6"
pallas-codec = "1.0.0-alpha.6"
# Blake2b-256 for hashing metadata-decoded datum candidates
# against the expected on-output datum hash (jpg.store's
# convention puts datum bytes in TX metadata, so the host
# can't resolve them via Dolos's witness-datum index — we
# reconstruct + hash-match here).
pallas-crypto = "1.0.0-alpha.6"
