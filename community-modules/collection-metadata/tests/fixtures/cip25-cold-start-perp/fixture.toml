# CIP-25 cold-start facade test for collection-metadata.
#
# Subscribing to the Perp policy triggers the chunked rebootstrap:
# scan utxos_by_policy → the plain Perp5158 user token is classified
# CIP-25 → resolve its mint TX via asset_state.initial_tx →
# tx_metadata → cardano_assets::cip25 decode → SnapshotChunk carrying
# one MetadataEntry{standard = cip25, immutable = true}. Blockless:
# cold-start is interest-driven, not block-driven.
#
# Perp5158 is the same asset the cip-25-mint/perp-policy golden uses,
# so the decoded metadata_json must match that fixture exactly.
version = 1

[[interest]]
kind = "holds_policy"
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"

# A current UTxO holding the plain Perp5158 user token — answers
# utxos_by_policy + read_utxos. No datum (CIP-25 carries no datum).
[[utxo]]
tx_hash = "3f99d88cf07027d69a1f36cd0d9dec1b90fb1366b675a36e7625cb9f05ab9644"
index = 0
address = "addr1q8pay93een8vr9gwjcud6f093fqjq0gyz6ylg8088r69jnsttadnk66gcdwcaykj7v243uxecjeu5wed6ljf0lrpflhs96f7f2"
lovelace = 1500000
[[utxo.assets]]
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"
asset_name_hex = "5065727035313538"
quantity = 1

# asset_state answers: Perp5158 → its mint TX (initial_tx). In
# production this comes from dolos AssetState (horizon-proof).
[[asset_state]]
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"
asset_name_hex = "5065727035313538"
initial_tx = "3f99d88cf07027d69a1f36cd0d9dec1b90fb1366b675a36e7625cb9f05ab9644"
initial_slot = 186913993

# tx_metadata answers: the mint TX's aux-data (label 721).
[[tx_metadata]]
tx_hash = "3f99d88cf07027d69a1f36cd0d9dec1b90fb1366b675a36e7625cb9f05ab9644"
aux_cbor_hex = ""
