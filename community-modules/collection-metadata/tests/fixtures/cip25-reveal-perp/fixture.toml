# CIP-25 REVEAL facade test for collection-metadata.
#
# Reveal collections mint a placeholder, then burn + re-mint with the
# final metadata (e.g. Funplastic: 6 mints / 5 burns for a supply-1
# NFT). dolos `AssetState` records `initial_tx` = the placeholder mint
# and `metadata_tx` = the latest metadata-bearing mint (the reveal).
#
# The facade must resolve `metadata_tx` (reveal — carries the traits),
# NOT `initial_tx` (placeholder — name + "Unrevealed", no traits). This
# fixture wires both into `tx_metadata`; the emitted SnapshotChunk must
# carry the REVEAL metadata with `source_tx` = the reveal tx.
#
# Reuses Perp5158's real revealed aux-data (identical to
# `cip25-cold-start-perp`) as the reveal, with a synthetic placeholder
# for `initial_tx` to prove the facade does NOT pick it.
version = 1

[[interest]]
kind = "holds_policy"
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"

[[utxo]]
tx_hash = "1111111111111111111111111111111111111111111111111111111111111111"
index = 0
address = "addr1q8pay93een8vr9gwjcud6f093fqjq0gyz6ylg8088r69jnsttadnk66gcdwcaykj7v243uxecjeu5wed6ljf0lrpflhs96f7f2"
lovelace = 1500000
[[utxo.assets]]
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"
asset_name_hex = "5065727035313538"
quantity = 1

# Placeholder mint (initial_tx) + reveal mint (metadata_tx). The facade
# must prefer metadata_tx.
[[asset_state]]
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"
asset_name_hex = "5065727035313538"
initial_tx = "1111111111111111111111111111111111111111111111111111111111111111"
initial_slot = 100000000
metadata_tx = "2222222222222222222222222222222222222222222222222222222222222222"

# initial_tx aux — placeholder metadata (name + "Unrevealed", NO traits).
# Must NOT appear in the output.
[[tx_metadata]]
tx_hash = "1111111111111111111111111111111111111111111111111111111111111111"
aux_cbor_hex = ""

# metadata_tx aux — the revealed metadata (full traits). This is what
# the SnapshotChunk must carry.
[[tx_metadata]]
tx_hash = "2222222222222222222222222222222222222222222222222222222222222222"
aux_cbor_hex = ""
