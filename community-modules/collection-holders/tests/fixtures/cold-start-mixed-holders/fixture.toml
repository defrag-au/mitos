# Cold-start scenario: synthetic small policy whose current
# UTxO set is distributed across all three `HolderRef`
# variants. Exercises the `update_interest(Add, holds_policy)`
# → `cold_start` → chunked snapshot emission path.
#
# Policy: aa11bb22cc33dd44ee55ff66112233445566778899aabbccddeeff00
#         (synthetic; the asset names are short hex labels)
#
# Holdings:
#   - Stake-delegated wallet (addr1q...):
#       asset "f00d" qty 1
#       asset "cafe" qty 1
#   - Enterprise wallet (addr1v...):
#       asset "beef" qty 1
#   - Script address (addr1w..., jpg.store v2 sale per
#     address-registry):
#       asset "dead" qty 5  (RFT-shape, marketplace-locked)
#
# Expected emission (single SnapshotBegin → SnapshotChunk →
# SnapshotEnd, holdings sorted by (asset_name_hex, holder)):
#
#   "f00d" / stake_cred -> qty 1
#   "cafe" / stake_cred -> qty 1
#   "beef" / payment    -> qty 1
#   "dead" / script     -> qty 5
#
# Locks in:
#   - `extract_holder_key` decoding for all three address shapes
#   - script-address surfacing (NOT filtered, per design)
#   - deterministic emission ordering
#   - cold-start emission triggered by `update_interest(Add)`

version = 1

[[interest]]
kind = "holds_policy"
policy = "aa11bb22cc33dd44ee55ff66112233445566778899aabbccddeeff00"

# Stake-delegated wallet — two distinct asset names.
[[utxo]]
tx_hash = "1111111111111111111111111111111111111111111111111111111111111111"
index = 0
address = "addr1q8pay93een8vr9gwjcud6f093fqjq0gyz6ylg8088r69jnsttadnk66gcdwcaykj7v243uxecjeu5wed6ljf0lrpflhs96f7f2"
lovelace = 2000000

[[utxo.assets]]
policy = "aa11bb22cc33dd44ee55ff66112233445566778899aabbccddeeff00"
asset_name_hex = "f00d"
quantity = 1

[[utxo.assets]]
policy = "aa11bb22cc33dd44ee55ff66112233445566778899aabbccddeeff00"
asset_name_hex = "cafe"
quantity = 1

