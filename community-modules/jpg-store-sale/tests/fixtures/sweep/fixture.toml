# jpg-store-sale golden scenario: multi-asset sweep (single
# buyer takes two listings in one TX).
#
# Three-block fixture:
#
# 1) `185112203.block.cbor` — first listing TX (slot 185112203,
#    tx 413acbf1...). Lists asset A on jpg.store V2.
# 2) `185112287.block.cbor` — second listing TX (slot 185112287,
#    tx 8dd0d20b...). Lists asset B on jpg.store V2.
# 3) `185128094.block.cbor` — sweep TX (slot 185128094,
#    tx 7ffb11af..., redeemer constructor 0 = Buy/Accept on
#    both inputs). One buyer atomically takes both listings;
#    payouts to seller(s) + jpg.store fee + royalties flow in
#    one TX.
#
# Expected emission: two `Sale` events, one per consumed
# listing UTxO. Each carries the asset moved, payouts from
# the original listing datum, and the same buyer address (the
# wallet that received both assets).
#
# Module's static interest in production is read from
# `jpg_store_sale.toml`. `mitos-run` reads interest from this
# fixture file so we mirror the addresses here.

