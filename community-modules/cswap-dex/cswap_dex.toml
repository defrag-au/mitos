abi_version = 2

# CSWAP runs all 82 pools at one script address. Single
# `at-address` predicate covers the brand's pool surface
# completely. Order/batcher addresses aren't in interest because
# the platform delivers every event from a matching TX — once a
# pool input or output triggers dispatch we see the full TX.
[interest]
addresses = [
    "addr1z8ke0c9p89rjfwmuh98jpt8ky74uy5mffjft3zlcld9h7ml3lmln3mwk0y3zsh3gs3dzqlwa9rjzrxawkwm4udw9axhs6fuu6e",
]
policies = []

[deps]
mitos-community-events = { path = "../../crates/mitos-community-events" }
pallas-primitives = "1.0.0-alpha.6"
pallas-codec = "1.0.0-alpha.6"
