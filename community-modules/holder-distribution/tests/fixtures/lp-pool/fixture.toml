# Cold-start scenario: LP-pool decomposition — the load-bearing
# financial golden. A tracked token (TOK) is held partly by a
# plain wallet and partly aggregated in a CSwap DEX pool. The
# module auto-discovers the pool (a holder at `cswap::POOL_SCRIPT_ADDR`),
# reads its datum (total_lp_tokens + lp_policy), scans the LP-token
# holder set, and redistributes the pool's aggregate to LP
# providers proportional to their LP share — recording each
# provider's `lp_amount` and keeping the rounding remainder as a
# residual pool entry.
#
# Exercises: `decompose_or_plain` → `read_pool_datum` →
# `fold_lp_page` (incl. CSwap farm staking-datum resolution) →
# `decompose_holders`. Captures CURRENT behaviour as the regression
# net for the SB5 sharded migration.
#
# SYNTHETIC: policy/asset/LP-policy are hand-built; the pool +
# staking datums are valid CBOR generated via mitos-dex-decode's
# own constructors (decode_pool_datum / decode_staking_datum).
#
# Tracked policy TOK: b1b1...b1, asset "TOK" (544f4b).
# LP-token policy:    cccc...cc, asset "LP"  (4c50).
# Pool datum:         total_lp_tokens = 1000, lp_policy = cc..cc.
#
# Holdings + LP shares (reserve = 1000 TOK, total_lp = 1000):
#   - Pool @ POOL_SCRIPT_ADDR: 1000 TOK aggregate  (the reserve)
#   - W1   @ addr1q8pay93…:       50 TOK  (plain holder, lp_amount 0)
#   - W2   @ addr1qymnnxq5…:      600 LP → 600 TOK attributed (lp_amount 600)
#   - Farm @ FARM_SCRIPT_ADDR:   300 LP → 300 TOK attributed to the
#                                staker (stake cred d3..d3 from the
#                                farm staking datum), lp_amount 300
#   - Residual: 1000 − 600 − 300 = 100 TOK stays with the pool
#               (role DexPool)

