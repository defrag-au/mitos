# Cold-start scenario: raw / NFT shape — a synthetic policy held
# across stake-delegated, enterprise, and script holders, with NO
# DEX pool and NO vesting. This is the plain `Scan → Emit` path:
# `cold_start` folds the UTxO set into the holder ledger and emits
# a chunked snapshot with no LP / vesting decomposition.
#
# This is the regression net for the SUM core ahead of the SB5
# sharded migration — capturing CURRENT behaviour so the migration
# (page-oriented sharding) must reproduce it exactly.
#
# Policy: a0a0a0a0...a0 (synthetic; short hex asset labels)
#
# Holdings:
#   - addr1q... (stake-key delegation)  -> "01" qty 1, "02" qty 1
#   - addr1v... (enterprise, no stake)  -> "03" qty 1
#   - addr1x... (script payment+deleg)  -> "04" qty 5
#
# Addresses reused verbatim from the collection-holders
# `cold-start-mixed-holders` fixture (known-good across all three
# `extract_holder_key` shapes: Stake / Enterprise / Stake-via-script).

