# mitos.toml — module config for the wayup-store-listing indexer.
#
# Listing lifecycle (create / price-update / unlisting) on the
# Wayup sale validator. Completed sales live in the sibling
# wayup-store-sale module; offers in wayup-store-offer.

abi_version = 2

# Runtime config — CBOR-encoded by mitos-build, deserialised by
# the module's `init`. The Wayup sale validator's payment-script
# hash: listing UTxOs share this payment credential but embed the
# seller's own stake key as the staking part, so they sit at
# different full addresses. The module identifies listing outputs
# by matching this payment credential.
payment_cred = "a76f0fb801a29f591e9871576508d85b0b5f3c38774f65032f58fdad"

[interest]
# Watch by payment credential (NOT a full address) — the staking
# part varies per seller. Bootstrap hydrates the current listing
# book via `utxos_by_payment_cred`.
payment_credentials = [
    "a76f0fb801a29f591e9871576508d85b0b5f3c38774f65032f58fdad",
]

[deps]
mitos-community-events = { path = "../../crates/mitos-community-events" }
pallas-primitives = "1.0.0-alpha.6"
pallas-codec = "1.0.0-alpha.6"
# bech32 → payment-credential extraction (identify listing outputs;
# the staking part varies per seller so a string compare won't do).
pallas-addresses = "1.0.0-alpha.6"
