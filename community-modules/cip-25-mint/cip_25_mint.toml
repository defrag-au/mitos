# mitos.toml — module config for the cip-25-mint indexer.
#
# Empty default interest set — consumer declares policies via
# `/api/_interest/cip-25-mint/subscribe` (kind = "policy").

abi_version = 2

[interest]
addresses = []
policies = []

[deps]
mitos-community-events = { path = "../../crates/mitos-community-events" }
# CBOR walking for label-721 metadata extraction. The platform's
# `chain-data::tx-metadata` returns aux-data as raw CBOR bytes
# that we navigate to find the asset's metadata entry.
minicbor = { version = "0.20", features = ["std"] }
# JSON serialisation of the decoded metadata.
serde_json = "1"
