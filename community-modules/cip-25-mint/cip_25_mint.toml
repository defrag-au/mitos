# mitos.toml — module config for the cip-25-mint indexer.
#
# Empty default interest set — consumer declares policies via
# `/api/_interest/cip-25-mint/subscribe` (kind = "policy").

abi_version = 2

[interest]
addresses = []
policies = []

[deps]
mitos-community-events = { path = "../../crates/mitos-community-events" }
# Shared CIP-25 (label-721) decoder — single source with the
# `collection-metadata` facade (replaced this module's local minicbor
# walker, so both emit identical `metadata_json`).
cardano-assets = { git = "https://github.com/defrag-au/shared-crates", rev = "d547c95c94a52bba618328ea7bf3b4474589abf1", default-features = false, features = ["cip25"] }
