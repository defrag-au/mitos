# jpg-store-offer regression: bootstrap-path resolution of
# hash-only datum via labels-50+ aux-data.
#
# TX:    d0552d974dc721bf2d55a1b6997730f454c0c1243b0ef12c16d0b44bdbb93fcd
# Slot:  187167735
# Block: f02f811936dfcea926cb5151c4935f37ba1c9b43627b0e5cd21bfccac19ddabe
#
# Bidder `4a00e5040c2d7e201a9c20744ace64bf28d1cda55999a4931e406922`
# submits a TX with 4 collection offers at the V2 CO script
# address (outputs 0-3, all 260 ADA, targeting policy
# 4523c5e21d409b81c95b45b0aea275b8ea1406e6cafea5583b9f8a5f).
#
# All four V2 outputs share a hash-only datum
# (hash `1da0ecf15627a9f90aa3d08fc66a592690a1e3bab9f34377d7ad2c31723ca511`).
# Datum bytes are revealed via TX-metadata labels 50..60 in the
# jpg.store labels-50+ chunked-hex convention, terminated by
# the `ff,` marker on label 61.
#
# **Why this fixture exists.** A user with 212 expected COs saw
# only 6 reach the consumer DO after recapture (see triage logs
# 2026-05-14). Counting bootstrap dispatch in the host showed all
# 4296 V2 UTxOs walked, so the loss is inside the module's decode
# pipeline — specifically the bootstrap-path branch where
# `p.datum.payload` is empty (host couldn't auto-resolve a
# hash-only datum) and the module must fall through to
# `chain_data::tx_metadata` + labels-50+ reconstruction. The
# existing `offer-create` and `offer-create-batch` fixtures cover
# the in-block path (block CBOR carries the aux-data inline);
# this fixture is the first to exercise the bootstrap branch.
#
# Fixture shape: the four V2 UTxOs are surfaced via `[[utxo]]`
# with `datum_hash` set but `datum_payload_hex` absent, matching
# the production shape where the host couldn't pre-resolve. The
# aux-data CBOR is provided via `[[tx_metadata]]` so the
# module's fallback path can hash-verify and decode.
#
# Expected emission: 4 `Create` events, one per output, in
# output-index order.

