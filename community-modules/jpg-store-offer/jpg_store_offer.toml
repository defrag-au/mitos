# mitos.toml — module config for the jpg-store-offer indexer.
#
# Offer lifecycle on jpg.store CO contracts (V2 + V3). Richer
# event surface than the predecessor `jpg-co` module:
#   - Create  (was: Created)
#   - Cancel  ┐
#   - Accept  ├ replaces a single `Spent` variant
#   - Update  ┘
#
# Cutover plan: ships alongside the existing `jpg-co` until the
# `cnft.dev-workers/workers/jpg-store-mirror` consumer migrates
# to the new wire format. Both modules can coexist; the address
# overlap means each TX is processed by both, emitting both
# event surfaces in parallel.

abi_version = 2

# Runtime config — passed to the module's `init(config)` as
# CBOR-encoded by mitos-build.
#
# `v3_address` is intentionally empty. The previous toml carried
# `addr1xxzvcf02fs5e...` here as a "V3" CO address, but the
# 2026-05-12 investigation decoded it and found it shares jpg.store's
# marketplace staking cred with the V2 offer contract but uses a
# different payment script — and that payment cred shows up *inside*
# V2 offer datums as a payout target. Sampling unspent UTxOs at that
# address turned up lovelace + NFT assets with no datum, which is
# operational/treasury state, not a CO. The wasm module's
# `JpgStoreOfferVersion::V3` enum variant and the `v3_address` config
# slot stay in place so a real V3 CO contract can drop in when (if)
# jpg.store ships one — flip the address back on, no schema churn.
v2_address = "addr1xxgx3far7qygq0k6epa0zcvcvrevmn0ypsnfsue94nsn3tfvjel5h55fgjcxgchp830r7h2l5msrlpt8262r3nvr8eks2utwdd"
v3_address = ""

[interest]
# Currently only V2. See the v3_address note above; add a V3 entry
# here once the correct contract address is identified.
addresses = [
    # V2 — jpg.store collection-offer payment script + marketplace
    # staking credential.
    "addr1xxgx3far7qygq0k6epa0zcvcvrevmn0ypsnfsue94nsn3tfvjel5h55fgjcxgchp830r7h2l5msrlpt8262r3nvr8eks2utwdd",
]
policies = []

[deps]
mitos-community-events = { path = "../../crates/mitos-community-events" }
# Offer datum decode + accept matching live in the shared marketplace crate (the
# single source of truth also used by the cnft.dev-workers firehose); it pulls
# pallas-primitives / pallas-codec transitively.
mitos-marketplace-decode = { path = "../../crates/mitos-marketplace-decode" }
pallas-codec = "1.0.0-alpha.6"
# blake2b for hash-matching candidate datum bytes recovered from
# jpg.store's labels-50+ aux-data convention.
pallas-crypto = "1.0.0-alpha.6"
