# wayup-store-offer golden: bootstrap-path create decode.
#
# Exercises the production cold-start path: a payment-credential
# interest is registered, `run_bootstrap` walks
# `utxos_by_payment_cred`, and each open offer UTxO is surfaced
# as a synthetic Produced event. The hash-only datum is NOT
# pre-resolved during bootstrap, so the module falls through to
# `chain_data::datum_by_hash` (served here by `[[datum]]`).
#
# Covers the wayup-specific decode paths:
#   - payment-credential watch (staking part varies per bidder)
#   - hash-only datum via datum_by_hash (no metadata fallback)
#   - non-positional target payout (scan for the non-ADA policy)
#   - collection-wide (empty asset-name map) AND asset-specific
#     (PRED03385) offers
#
# Offers (real mainnet, bidder cba51a…):
#   1. collection-wide, policy a316bcf7…, 6 ADA
#      (TX 3938ca11…, output 1, datum 0d46ce59…)
#   2. asset-specific PRED03385, policy 73056bff…, 150 ADA
#      (TX 42f7a522…, output 1, datum c4c6a021…)
#
# Datum CBOR verified to blake2b-256 to its datum hash.

version = 1
bootstrap = true

[[interest]]
kind = "at_payment_cred"
hash = "27d46ecbec94b052d8f875cf3beafd0e8ca40e8ad069f677e0a128ea"

# Collection-wide offer.
[[utxo]]
tx_hash = "3938ca11327828f9d9efdf10399f949132f48c80af88686003e262d05a090c08"
index = 1
address = "addr1zynagmktaj2tq5kclp6u7wl2l58gefqw3tgxnanhuzsj36kt55dzuk6msq4qgq4g0dmz6tkvdvdfkmgd6uyd4urms2ksy9ssnc"
lovelace = 6000000
datum_hash = "0d46ce59bab033869c50e4df1aaedbf90ccc925dbbe832b73262de2d9560afef"

# Asset-specific offer (PRED03385).
[[utxo]]
