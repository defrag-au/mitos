# asset-transfer golden scenario: wallet-to-wallet bulk NFT
# transfer between two of the same operator's wallets, with
# one NFT retained as change.
#
# TX:    fa51e39fd7dc797cc45e761313b1e966346589ecbfa24c4dc383f66c230a8f35
# Slot:  186904385
#
# Shape:
#   - 3 inputs, all from wallet A
#       [0] 1 Perp NFT  (policy e6ba9c0f… name Perp0712)
#       [1] 10 Perp NFTs (Perp0698, Perp1363, Perp2453, Perp2525,
#                         Perp2542, Perp3336, Perp3811, Perp3973,
#                         Perp5232, Perp5976)
#       [2] 1 CIP-68 user token (policy 4523c5e2… name BudC4162)
#   - 2 outputs
#       [0] wallet B receives 1 CIP-68 + 10 Perps (everything
#           except Perp3973)
#       [1] wallet A retains Perp3973 as change
#
# Per-(address, policy, asset) netting drops the Perp3973 entry
# at wallet A (delta -1 + 1 = 0). Expected emission: **11
# Transfer events** — 10 Perps + 1 CIP-68 — all attributed to
# wallet A → wallet B.
#
# Exercises:
#   - Multi-asset, multi-policy single-TX move
#   - Change-output netting (Perp3973 not emitted)
#   - Single-sender topology (no FT ambiguity)
#
# Module's runtime interest is empty by default; for tests we
# scope to both policies the TX touches so the platform's
# dispatch composer delivers Produced + Consumed events for
# the relevant outputs.

version = 1

[[interest]]
kind = "holds_policy"
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"

[[interest]]
