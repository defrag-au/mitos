# jpg-store-listing golden scenario: clean V2 cancel.
#
# Two-block fixture:
#
# 1) `172868651.block.cbor` — listing TX (slot 172868651,
#    tx 34545914...). Lists Perp #3559 on jpg.store V2.
#    The datum commits two payouts — 11 ADA and 96.25 ADA
#    — for a total list price of 107.25 ADA. (An earlier
#    revision of this comment said 11 + 429 = 440, derived
#    from an assumed 2.5% fee rather than read off the
#    datum; the payout array holds exactly two entries and
#    sums to 107,250,000 lovelace.)
#
# 2) `186544965.block.cbor` — cancel TX (slot 186544965,
#    tx 4e74119a..., redeemer constructor 1 = Cancel).
#    Seller delists Perp #3559 — NFT returns to seller's
#    wallet, no marketplace payouts flow.
#
# Block 2 is here for the cancel event itself, NOT to supply
# block 1's datum. The listing output commits its datum by
# hash and carries no payload, and the witness-datum harvest
# never resolved it — which is why this golden asserted
# `payouts: []`, `price_lovelace: 0` until 2026-09-09. The
# payouts now come from the listing TX's OWN metadata
# (jpg publishes the preimage under labels 50+), recovered
# and hash-verified by `recover_datum_from_metadata`.
#
# Module's static interest in production is read from
# `jpg_store_listing.toml`. `mitos-run` reads interest from
# this fixture file so we mirror the addresses here.

