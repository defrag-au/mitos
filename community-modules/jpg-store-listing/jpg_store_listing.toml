# mitos.toml — module config for the jpg-store-listing indexer.
#
# Listing lifecycle on jpg.store sale contracts (V1/V2/V3/V4).
# Sale events live in a sibling jpg-store-sale module; this one
# stays narrowly scoped to listing-book lifecycle (Create /
# Update / Unlisting).

abi_version = 2

[interest]
# Hard-wired jpg.store sale contract addresses — bech32 strings
# from the shared `address-registry`. We don't pull the registry
# crate into the wasm module since the list is small and stable;
# updating means a literal string change + a rebuild.
addresses = [
    # V1 — script hash 9068a7a3…, delegated form.
    "addr1zxgx3far7qygq0k6epa0zcvcvrevmn0ypsnfsue94nsn3tvpw288a4x0xf8pxgcntelxmyclq83s0ykeehchz2wtspks905plm",
    # V2/V3 — one validator, script hash c727443d…, in both of its
    # bech32 forms: addr1x (script payment + script stake) and
    # addr1w (script payment, no stake). Both must be listed; they
    # are distinct addresses on chain and listings sit at either.
    "addr1x8rjw3pawl0kelu4mj3c8x20fsczf5pl744s9mxz9v8n7efvjel5h55fgjcxgchp830r7h2l5msrlpt8262r3nvr8ekstg4qrx",
    "addr1w8rjw3pawl0kelu4mj3c8x20fsczf5pl744s9mxz9v8n7eg0fcr8k",
    # V4 — intentionally absent. No valid V4 address is known: the
    # string previously here failed its bech32 checksum, as does the
    # copy in the market-ledger's venues.toml, so it silently matched
    # nothing. `address-registry` pulled its V4 row for the same
    # reason. Restore this only with an address that round-trips.
]
policies = []

[deps]
mitos-community-events = { path = "../../crates/mitos-community-events" }
# Listing lifecycle decode (produced/consumed matching, datum decode, price
# math) lives in the shared marketplace crate — the single source of truth the
# market-ledger walker shares. Pulls pallas-primitives / pallas-codec
# transitively; this module no longer walks PlutusData itself.
mitos-marketplace-decode = { path = "../../crates/mitos-marketplace-decode" }
