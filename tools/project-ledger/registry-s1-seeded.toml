#   - The ROYALTY address. Derived from CIP-27 `777.addr` on the policy's own
#     mint metadata (rate 0.10, observed at slot 160,419,671). It is seeded with
#     `role = royalty`, which `provenance` already treats as a coreness root —
#     so royalty-funded mints are caught without asserting anything.
#   - The policy SIGNER credential, read from the mint script.
#   - $mekkacrow — a genuine customer (operator confirmation 2026-08-30).
#     Recorded here as examined-and-excluded so it is not re-proposed every run.

