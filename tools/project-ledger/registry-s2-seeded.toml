193,809,319 and 195,592,727. Observed in the mint transactions themselves, \
not asserted by anyone. DISTINCT from the S1 treasury \
(stake1u98f5mr0mn8tv2kqndk5cwen4uasc7cewlzdklz6y664zacl9lvjz)."""

[[wallet]]
