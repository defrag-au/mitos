# Mekka S2 — SEEDED run (2026-08-30), successor to the cold-start
# `registry-s2.toml`.
#
# The cold start proved the trail could bootstrap from the chain alone. This
# run declares what the chain cannot state, so the project boundary is
# explicit rather than left to frontier promotion.
#
# NOT declared here, deliberately:
#   - The ROYALTY address. Derived from CIP-27 `777.addr` in the policy's own
#     on-mint metadata (observed at slot 160,419,671 for S1; S2 resolves its
#     own). S2's royalty wallet DIFFERS from S1's — declaring it by hand would
#     reintroduce assertion-as-fact and would carry S1's answer into S2.
#   - The policy SIGNER credential. It is the `sig` credential in the mint
#     script and is read from chain.
#   - $mekkacrow. The handle sits on TWO stakes 160 slots apart
#     (stake1uxmaqke42j9… which also carries $btc-bank, and stake1ux9nk26sat…)
#     and nothing observed disambiguates them. Declaring the wrong one would
#     misplace the boundary, so the walk discovers it instead.

project = "Mekka S2"

[[policy]]
id    = "a8056299a9fb1c3ab78bcc58e6c5d806bbe88413cff1766b17979a43"
label = "Mekka (S2)"

# ---------------------------------------------------------------------------
# THE PROJECT BOUNDARY. `role` decides it (registry.rs PROJECT_SIDE_ROLES):
# value arriving at these wallets has come back, value leaving them has
# crossed out. Get one wrong and an extraction reads as a deployment — so
# each carries what it rests on.
# ---------------------------------------------------------------------------

