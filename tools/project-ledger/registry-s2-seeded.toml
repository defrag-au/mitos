it to the frontier on its own (role `promoted`, 4 receipts, 1 counterparty); \
declaring it makes the boundary explicit rather than promotion-dependent."""

# ---------------------------------------------------------------------------
# TERMINAL — recorded on contact, NEVER expanded.
#
# This is the distinction the S1 run learned the hard way: seeding a
# wide-social-graph wallet as an ordinary `[[wallet]]` on 2026-08-20 let it
# RECRUIT, and the frontier went 180 → 6,424 parties, the ledger 7.1M → 18.0M
# rows, and unresolved inputs 0.059% → 16.5%. Terminal declaration gives the
# full two-sided history — a member's flows are booked whether or not it
# expands — without the recruitment.
#
# Numeric thresholds are deliberately LEFT AT DEFAULT. The cold-start run had
# no [terminal] block at all; changing seeding and thresholds in the same run
# would confound the two.
# ---------------------------------------------------------------------------

[[terminal.party]]
stake  = "stake1uy0x3exj6jgh3nd3fk838qdqxjeq6vsx6lzdylk0vadvc2qwfl6ha"
label  = "minting front"
# `mint` — a wallet that mints on the project's behalf. Declared TERMINAL so it
# is named without expanding: it holds hundreds of assets and a wide
# counterparty set, and seating it as a `[[wallet]]` would recruit all of it.
role   = "mint"
source = """CONFIRMED a minting front by the operator, 2026-08-30, on \
independent inspection. Carries no ADA Handle. The single largest self-minter \
in BOTH seasons: 108 units in S2 on 16,084 ₳ from the S2 treasury, and 642 \
units in S1 on 94,177 ₳ direct from the S1 treasury plus 3,865 ₳ from \
$mekkaops — 87% of S1's team-funded supply and 73% of S2's.

Declared rather than left to inference. `provenance` already flags it at 94% \
(S1) and 100% (S2) core-funded, but a figure this load-bearing should not \
depend on a wallet clearing a threshold: change `--threshold` and an inferred \
classification moves, whereas an asserted one is on the record with its \
source."""

[[terminal.party]]
stake  = "stake1u9af4pdvysr7ysqm3n0l2j2slkzlrvkz8ks8gn8mwy77rrsawvqey"
label  = "$jprigs33"
role   = "founder"
source = """ADA Handle `jprigs33`, held on this stake since slot 118,208,143 \
— long predating both mints. Founder (user confirmation 2026-08-30). \
`founder` is an IDENTITY and does not place them inside the boundary: assets \
arriving here are value LEAVING the project and must stay visible as such. \
Measured on the 08-30 walk: 105 assets received across 11 transactions with \
ADA paid in ZERO of them, all three senders being the treasury-funded \
self-mint wallets. Terminal so its own funding history is booked in full \
without recruiting its social graph."""

# ---------------------------------------------------------------------------
