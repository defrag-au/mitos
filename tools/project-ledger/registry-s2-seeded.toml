# Roles are `contractor`, not `team` — these are paid for defined work, and the
# advertised 15% ops·tools·team bucket covers them. Not `service_provider`:
# "service" already means DEX/batcher/marketplace rails in `classify`.
# ---------------------------------------------------------------------------

