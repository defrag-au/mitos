# tx-index CLI — build/refresh the index beside the Mithril chunk store,
# look hashes up, and host the loopback read surface.
#
# The library (crates/tx-index) is what walkers on the box link directly;
# this binary is the cron step and the off-box door.
[package]
name = "tx-index-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build and serve the tx hash → chunk offset index over a Mithril immutable DB"

[[bin]]
name = "tx-index"
path = "src/main.rs"

[dependencies]
tx-index = { path = "../../crates/tx-index" }
# The mint-keyed companion, built from the SAME extraction pass. Here rather
# than as its own service because a second pass would cost +100% against the
# measured +1.8% — see `--policy-index-dir`.
policy-index = { path = "../../crates/policy-index" }

clap = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# `serve` — the market-ledger / wallet-sieve serve pattern: axum on loopback,
# bearer-gated data routes, tokio confined to serve::run.
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
