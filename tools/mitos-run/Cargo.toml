[package]
name = "mitos-run"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitos-run"
path = "src/main.rs"

[dependencies]
# Reuse the platform's wasmtime engine + linker + WIT bindings.
# Same code path the production host uses — anything that runs
# clean here will run clean there.
mitos-platform = { path = "../../crates/mitos-platform" }
mitos-data-plane = { path = "../../crates/mitos-data-plane" }
# Host-side typed decoder for emit-channel payloads — turns the raw
# CBOR bytes coming out of the wasm module into readable JSON keyed
# off the module's `manifest.module.id`. `decode` feature pulls in
# ciborium + serde_json; same wire format used in production.
mitos-community-events = { path = "../../crates/mitos-community-events", features = ["decode"] }
# Used to encode interest predicates so we can drive the module's
# `update_interest` export the same way the production follower does.
ciborium = "0.2"

# Typed asset/policy newtypes — for v2 fixture interest predicates.
cardano-assets = { workspace = true }
# Pallas hash newtype — the data-plane trait method signatures
# carry `Hash<32>` / `Hash<28>` directly.
pallas-primitives = { workspace = true }
# For pre-harvesting aux-data from `--block` arguments into the
# fixture data plane so `chain_data::tx_metadata` lookups against
# TXs in the dispatched block resolve without operator hand-
# authoring `[[tx_metadata]]` entries.
pallas = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
hex = { workspace = true }
toml = "0.8"
serde = { workspace = true }
async-trait = { workspace = true }
