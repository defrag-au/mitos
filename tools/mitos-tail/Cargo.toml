[package]
name = "mitos-tail"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitos-tail"
path = "src/main.rs"

[dependencies]
mitos-core = { path = "../../crates/mitos-core" }
# Typed protocol-event taxonomy — used by `--decode protocol-event`
# to surface brand + kind + brand-specific payload arms in
# human-readable output instead of dumping raw CBOR bytes.
mitos-protocol = { path = "../../crates/mitos-protocol" }

clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }
ciborium = "0.2"
url = "2"

[dev-dependencies]
# Used in unit tests to construct sample `ProtocolEvent`s the same
# way the marketplace indexer does.
cardano-assets = { workspace = true }
pipeline-types = { workspace = true }
