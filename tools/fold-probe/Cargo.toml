# fold-probe — what a UTxO fold over the Mithril chunk log actually costs.
#
# A measurement tool, not a service. It depends on `tx-index` for
# `list_chunks` (the one place that decides which chunks are complete) and on
# `mitos-chain-walk` for `CHUNK_SLOTS`, so the windows it reports agree with
# the walkers. `pallas-addresses` is here for `byron::AddressPayload`: pallas
# hands a Byron address over as an opaque byte string, so the only way to check
# one is to make it parse as what it claims to be. No new external crates:
# every dependency below is already in `[workspace.dependencies]`.
[package]
name = "fold-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Measure decode/apply split, same-chunk spend rate and live-set size for a UTxO fold over Mithril chunks"

[[bin]]
name = "fold-probe"
path = "src/main.rs"

[dependencies]
# The artifact format and its reader. Extracted on 2026-09-23 because the second
# consumer appeared: the probe WRITES the book and mitos wants to SERVE it. The
# probe is now a client of the layout rather than its owner — the row offsets,
# the entry shape, the directory fill and the policy table live there.
live-book = { path = "../../crates/live-book" }
# Structured timing, so a number this tool prints can be compared with one another
# tool prints — one vocabulary of operation names, one report shape.
mitos-meter = { path = "../../crates/mitos-meter" }

tx-index = { path = "../../crates/tx-index" }
mitos-chain-walk = { path = "../mitos-chain-walk" }

# The platform's metadata decode, so the probe measures the pipeline that will
# actually run: `cip25_metadata_value` reads the raw document out of the aux
# CBOR and `asset_from_metadata_value` is the v2 extractor the live modules and
# collection-ownership already run. Both are in `[workspace.dependencies]`, so
# the "no new external crates" rule above still holds.
cardano-assets = { workspace = true }
hex = { workspace = true }

pallas-addresses = { workspace = true }
pallas-codec = { workspace = true }
pallas-primitives = { workspace = true }
pallas-traverse = { workspace = true }

clap = { workspace = true }
anyhow = { workspace = true }
