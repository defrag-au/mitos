[package]
name = "market-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "market-ledger"
path = "src/main.rs"

[dependencies]
# Decode surface — the single source of truth shared with the live mitos
# modules and the cnft.dev-workers firehose. The walker maps chain data into
# its neutral `DecodeTx` and consumes the crate's outputs; no parallel decode.
mitos-marketplace-decode = { path = "../../crates/mitos-marketplace-decode" }
# Wire event types the decoders return — matched to attribute a kind per event.
mitos-community-events = { path = "../../crates/mitos-community-events" }
# CIP-14 fingerprint (`asset1…`), computed per row like the D1 firehose does.
cardano-assets = { workspace = true }

# Wire format served by `serve` (shared with consumers — egui frontends etc).
market-ledger-wire = { path = "../../crates/market-ledger-wire" }

# Operational ledger.
rusqlite = { workspace = true }
# Compact buffer-checkpoint serialisation (assets per buffered output) + the
# hot-window D1 upload (blocking HTTP — the walker's main loop is sync).
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

# Immutable-DB chunk reader (Mithril snapshot → block CBOR) + block/tx/address
# decode. The tx decode (canonical redeemer ordering, witness-datum extraction)
# mirrors mitos-data-plane's `block_events::project_tx` — reimplemented here on
# bare pallas to avoid dragging that crate's dolos deps into the walker.
pallas-hardano = { workspace = true }
pallas-traverse = { workspace = true }
pallas-addresses = { workspace = true }
pallas-primitives = { workspace = true }
pallas-codec = { workspace = true }
# blake2b for verifying jpg labels-50 offer-datum reconstructions at create time.
pallas-crypto = "1.0.0"

# `serve` HTTP read surface. The tokio runtime is confined to the serve
# subcommand — the walker's main loop stays sync.
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }

clap = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
hex = { workspace = true }

# Venue registry is a small TOML file; parse it directly rather than pull the
# whole `config` stack (same choice `capture-block` makes for `dolos.toml`).
toml = "0.8"
