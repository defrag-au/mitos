# wallet-sieve — on-demand wallet flow excavation. The sieve passes need no
# index; sender resolution rides the tx index.
#
# The other walkers (market-ledger, project-ledger, wallet-trace) decode the
# whole chain because their target set is global. This tool's target is ONE
# wallet, and a wallet's 28-byte credentials appear as raw bytes inside every
# output address that pays it — so the query primitive is SIMD substring
# search over raw chunk bytes, with CBOR decode only on hit. Scan cost is
# chain-size-bound, not wallet-size-bound; measured 2026-08-25 on
# cardano-infra the full 216GB sweep is ~2.5 min at 4 parallel readers.
#
# The one thing bytes cannot find is a SENDER (a tx hash is computed, never
# stored), which is why pass C uses `tx-index` (crates/tx-index) instead.
#
# Design + measurements: cnft.dev-workers memory `project_wallet_flow_explorer`.
[package]
name = "wallet-sieve"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "On-demand single-wallet flow excavation over a certified Mithril snapshot — byte sieve for flows, tx-index for senders"

[[bin]]
name = "wallet-sieve"
path = "src/main.rs"

[dependencies]
# Shared walker plumbing: immutable-DB iteration (incl. the fuzzy slot seek)
# and chunk arithmetic. Same substrate as the other three walkers.
mitos-chain-walk = { path = "../mitos-chain-walk" }

pallas-traverse = { workspace = true }
pallas-addresses = { workspace = true }
# The chain-tail spool follower (N2N chainsync + blockfetch to a relay).
pallas-network = { workspace = true }

# The scanning machine — parallel chunk memmem + decode-on-hit — extracted
# to a shared crate so token-ledger's sieve walk uses the same core.
chain-sieve = { path = "../../crates/chain-sieve" }

# Sender resolution — tx hash → body offset over the same chunk store, so
# pass C is a point lookup per foreign input instead of a decode+hash sweep
# over bands of chunks. The sweep survives only as the fallback for chunks
# the index has not been rebuilt over yet (or an absent index).
tx-index = { path = "../../crates/tx-index" }

# `EventKind` — the market ledger's own vocabulary, which is what lands in the
# `market_events.kind` column this tool reads. Depended on rather than
# re-spelled: the hand-written list it replaces had drifted, recognising three
# kinds the ledger never writes and missing the two it does for accepted
# offers.
market-ledger-wire = { path = "../../crates/market-ledger-wire" }

# Still used directly by the tail spool's per-block gating.
memchr = "2"
aho-corasick = "1"

clap = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# `serve` — the hosted read surface (market-ledger serve pattern): axum on
# loopback, per-wallet sqlite cache, tokio confined to serve::run.
tokio = { workspace = true }
tokio-stream = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
rusqlite = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
