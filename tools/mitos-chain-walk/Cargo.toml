[package]
name = "mitos-chain-walk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared plumbing for Mithril-snapshot walkers: bootstrap, immutable-DB iteration, bare-pallas tx decode, crash-visible checkpoint mirror"

[lib]
path = "src/lib.rs"

[dependencies]
# Immutable-DB chunk reader (Mithril snapshot → block CBOR) + block/tx/address
# decode. The tx decode (canonical redeemer ordering, witness-datum extraction)
# mirrors mitos-data-plane's `block_events::project_tx` — reimplemented on bare
# pallas so walkers never drag that crate's dolos deps.
pallas-hardano = { workspace = true }
pallas-traverse = { workspace = true }
pallas-primitives = { workspace = true }
pallas-codec = { workspace = true }

# Bootstrap args are CLI-shaped on purpose: every walker exposes the same
# `bootstrap` subcommand.
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
