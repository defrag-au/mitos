# The Perps event streams, and where their chain comes from.
#
# One file, two consumers: `token-ledger walk --profile` reads the walk settings and the
# collection list; `event-firehose --profile profiles/perps.toml` runs that walk and draws
# its events. Nothing here scores anything.
#
# The `[[collection]]` keys mirror the frozen achievement catalogue
# (cnft.dev-workers/config/achievements/perps.toml) on purpose: the viewer and the
# evaluator must not disagree about which policies Perps is.

schema = 1

[walk]
# The local Mithril snapshot. `<data-dir>/immutable` is opened directly — no archive, no
# network, no Koios. Chunks 6723–9337 are on disk and the policy index beside them knows
# both collections' first mints, so this profile walks end to end offline.
data-dir = "~/data/mithril"

# Each collection gets `<db-dir>/<id>.db`. The walk resumes from its own ledger, so a second
# run continues where the first stopped; delete the db (or pass `--fresh`) to start over.
db-dir = ".tmp/ledgers"

# Where a collection with no `first-mint-slot` of its own would start. Both collections here
# state their own, so this is only the fallback.
from-slot = 170445182

# Memmem each raw block for the policy id and decode only on a hit. The walk's CPU is almost
# entirely decode, so this is the difference between tens of minutes and about one.
sieve = true

[[collection]]
id = "perps"
kind = "nft"
policy = "e6ba9c0ff27be029442c32533c6efd956a60d15ecb976acbb64c4de0"
# From `~/data/mithril/policies/<policy>.json`. That figure is the policy's ROOT TOKEN
# (`earliest_asset` is the empty name), which CAIP-19 cannot express — the two movements it
# produces are reported as unrepresentable. The first NFT event is 513,113 slots later at
# 170958295. Stating it here is what lets the walk call this collection's coverage COMPLETE,
# which is what every "never sold" achievement depends on.
first-mint-slot = 170445182

[[collection]]
id = "perp-coin"
kind = "token"
policy = "d9d59e71eb99e653a493956a6826a406060706bd8c9a2427b3564f64"
asset-name-hex = "5045525020434f494e"
# Ten months earlier than the NFTs: 2025-01-13 against 2025-11-01. Without its own floor
# this collection would start at the NFT mint and silently lose almost all of its history —
# which is why `eligible_since_slot` was still unset in the frozen catalogue.
first-mint-slot = 145246220
