[package]
name = "ownership-indexer-module"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.54"
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
hex = "0.4"

# mitos-protocol — shared wire-type crate. The dynamic-interest
# mechanic decodes `Vec<Interest>` from CBOR bytes the host
# hands across the WIT boundary. Path-dep into the main mitos
# workspace; this module is in a sibling workspace so the cdylib
# build settings don't bleed into the host build.
mitos-protocol = { path = "../../../crates/mitos-protocol" }
