[package]
name = "mitos"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitos"
path = "src/main.rs"

[dependencies]
mitos-core = { path = "../../crates/mitos-core" }
mitos-config = { path = "../../crates/mitos-config" }
none-match-indexer = { path = "../../crates/none-match-indexer" }

# Dolos for the embedded data plane.
dolos = { workspace = true }
dolos-core = { workspace = true }
dolos-cardano = { workspace = true }
dolos-minibf = { workspace = true }

# Runtime / HTTP / observability.
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
axum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# CLI / config.
clap = { workspace = true }
config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = "3"
