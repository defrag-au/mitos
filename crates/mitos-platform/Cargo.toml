[package]
name = "mitos-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

# Wasm-isolated module runtime for mitos. Loads `.wasm` indexer
# modules from the local filesystem, instantiates them in
# wasmtime sandboxes, dispatches chain events through a typed
# WIT ABI, and supervises traps with author-declared strategies.
#
# v1 scope (strict): one module slot, filesystem-loaded,
# observable equivalence with today's monolithic-bundle host.
# Multi-tenant module hosting, HTTP control plane, OCI registry,
# hot-reload of running modules — all deferred to v2+.
#
# Strategy doc:  ../../docs/strategy/MITOS_PLATFORM_V1.md
# Roadmap doc:   ../../docs/design/MITOS_ISOLATION_ROADMAP.md
# Companion doc: ../../docs/strategy/MITOS_COMPANION_PATTERN.md

[dependencies]
# Wasmtime runtime. The `async` feature makes generated host fn
# bindings return futures; `component-model` enables WIT-defined
# components. We deliberately do NOT enable `component-model-async`
# — that's the stream/future ABI which our WIT does not use and
# wasmtime documents as "_very_ incomplete".
#
# ⚠️ The major tracks the `wasi:cli` package version the Rust
# toolchain's `wasm32-wasip2` std imports: wasmtime-wasi 44 speaks
# `wasi:cli@0.2.6` and 48 speaks `0.2.12`, which is what the current
# channel's std asks for. A toolchain bump that moves the WASI version to one
# whose interfaces differ fails component instantiation with "component imports
# instance `wasi:cli/exit@0.2.x`, but a matching implementation was not found" —
# the same mismatch would stop the HOST loading a module this build
# produced, so the two move together. The version is declared in
# `wasmtime-wasi`'s `src/p2/wit/deps/cli.wit`; read it before moving
# either side.
wasmtime = { version = "48", features = ["async", "component-model"] }
# WASI Preview 2 host impls. wasm32-wasip2 std lib imports
# `wasi:io`, `wasi:cli`, `wasi:clocks` etc. by default; we don't
# rely on any of them in the v1 ABI but the linker still needs
# matching impls so component instantiation succeeds. We feed
# every module a default WASI context (no real I/O surface).
wasmtime-wasi = { version = "48" }

# Data plane — module host fns proxy through this for chain reads.
mitos-data-plane = { path = "../mitos-data-plane" }

# Local tx hash → (chunk, offset) index over the Mithril chunk store.
# Serves the aux-data tier by mmap instead of a remote provider; see
# `src/local_tx_index.rs`.
tx-index = { path = "../tx-index" }

# Platform v3's identifiers and lifecycle state machines. This crate
# uses `ids` only — `InstanceKey` is what the storage layout is keyed
# by, and its validation is what keeps a module id out of a `join()`
# it could traverse out of. The state machines stay unwired until the
# host becomes instance-aware.
mitos-lifecycle = { path = "../mitos-lifecycle" }

# Wire-format types shared with the CF companion runtime —
# `SubscribeRequest`, `SubscribeResponse`, `DialBackOverride`,
# `ChainPoint`. Same crate the cnft.dev-workers companion imports
# from, so the wire shape is single-sourced.
mitos-protocol = { path = "../mitos-protocol" }

# Typed asset / address newtypes — surfaced through WIT records
# in the chain-data interface.
cardano-assets = { workspace = true }

# Block decode happens host-side; modules consume typed values
# only. Pallas stays in the host crate, never in modules.
pallas = { workspace = true }
pallas-primitives = { workspace = true }
pallas-traverse = { workspace = true }

# Dolos for the chain-event source feeding the dispatch loop.
dolos-core = { workspace = true }

# Storage for module state (KV) + per-module cursor + WAL. Same
# version the rest of the workspace uses.
redb = { workspace = true }

# A client move copies its parent instance's state files with the parent's
# follower stopped, so the copy is measured downtime. `reflink_or_copy` is a
# byte copy on today's ext4 and a metadata clone on a filesystem that supports
# one — see the workspace entry.
reflink-copy = { workspace = true }

# Async runtime. Module dispatch + host I/O run on Tokio.
tokio = { workspace = true }
tokio-util = "0.7"
# HTTP client for the companion dialer. Replaced tokio-tungstenite
# after the WS → HTTP delivery transport migration.
reqwest = { workspace = true }
url = "2"
async-trait = { workspace = true }
futures-util = "0.3"

# Admin HTTP surface — `/_admin/modules/*` lives here. Same axum
# version the rest of the workspace uses (see workspace deps in
# the root Cargo.toml).
axum = { workspace = true, features = ["multipart", "query"] }
tower = { workspace = true }

# Serialisation for module config (CBOR'd typed config from
# shared crate) + persisted state.
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = "0.11"
ciborium = "0.2"
toml = "0.8"

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }
sha2 = "0.10"

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }
ciborium = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
# Drives the admin router via its tower::Service surface.
tower = { workspace = true, features = ["util"] }
# Companion-router tests need a temp ModuleStorage root.
tempfile = "3"
# Validates the bech32 addresses declared in community-module configs — see
# tests/community_module_interest.rs. Dev-only: the platform itself treats
# interest addresses as opaque strings.
pallas-addresses = { workspace = true }
