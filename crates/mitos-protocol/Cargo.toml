[package]
name = "mitos-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

# Wire-format types and selector machinery for the mitos
# subscription model. Deliberately framework-free — no dolos,
# gasket, axum, tokio-tungstenite — so CF Workers and other
# consumers can pull this in to deserialize protocol events
# without dragging in the whole indexer runtime.
#
# See `../../docs/design/SUBSCRIPTION_MECHANICS.md` for the full
# design.

[dependencies]
serde = { workspace = true }
# The validated id newtypes (`ModuleId`, `Sha256Hex`, `Revision`) an
# announcement is made of, so a malformed digest is a DECODE error rather than
# something each side checks by hand. Pure — `serde` + `thiserror` only — so
# this crate stays wasm-safe for the companions that compile it.
mitos-lifecycle = { path = "../mitos-lifecycle" }
serde_bytes = "0.11"
# CBOR encode/decode helpers ride alongside the wire types so both
# host (mitos-core) and CF companion can use them. Framework-free.
ciborium = "0.2"

# Selector backing — `EnumSet<MarketplaceBrand>` etc.
enumset = { version = "1.1", features = ["serde"] }

# Shared asset + pipeline types referenced by the protocol-event
# taxonomy and the asset selector. Same versions cnft.dev-workers
# uses, so events deserialise identically across consumers.
cardano-assets = { workspace = true }
pipeline-types = { workspace = true }

# Error type for the wire codec helpers (`SubscribeRequest::encode`,
# etc.). Workspace pin — same major as the rest of the workspace.
thiserror = { workspace = true }

# `AnnouncedModule::from_built` hashes the config bytes a worker embedded and
# compares them with the digest its build recorded. Pure Rust, so this crate
# stays compilable for wasm32 in the companions.
sha2 = "0.10"
hex = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
ciborium = "0.2"
