[package]
name = "mitos-community-events"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Typed event payloads for mitos community modules (auto-loaded wasm modules under mitos/community-modules/<name>/)."

[lints.clippy]
disallowed_methods = "deny"

[features]
default = []
# Enable host-side decode + pretty-print of emit-channel payloads. Off
# by default so wasm-module consumers (encoder side) don't pull in
# ciborium + serde_json. `mitos-run` and any future test harness
# enable this feature to deserialise emissions for golden tests.
decode = ["dep:ciborium", "dep:serde_json"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
# Compact CBOR encoding of raw byte fields (e.g. `jpg_co::CoChange::Created::datum_cbor`).
# Without this, `Vec<u8>` serialises as a CBOR array of ints with ~10x bloat.
serde_bytes = "0.11"
# Host-side decode path — see `decode` feature flag.
ciborium = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }
