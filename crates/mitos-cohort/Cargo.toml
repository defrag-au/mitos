[package]
name = "mitos-cohort"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "What KIND of holder an address is — burn / pool / vesting / script / wallet, with how firmly each is known. A pure function of the address plus two registries, so reclassifying is a re-derivation and never a re-walk."

[lints.clippy]
disallowed_methods = "deny"

[dependencies]
# Address parsing only. Read through pallas rather than by bech32 prefix:
# `addr1z` covers two distinct address types and a prefix test silently
# mis-sorts one of them.
pallas-addresses.workspace = true
# Lock-platform recognition by payment credential (CrowdLock / Shield,
# snek.fun). A decode crate, so this adds nothing beyond pallas.
mitos-vesting-decode = { path = "../mitos-vesting-decode" }
# Launchpad bonding-curve recognition by payment credential. Same pure-decode
# class as the vesting crate, so this keeps the wasm cost unchanged.
mitos-launchpad-decode = { path = "../mitos-launchpad-decode" }
# Burn sinks, and every other behaviour, by payment credential. The table is
# HOSTED — `theyexist/address-registry` authors it, and a consumer supplies the
# loaded bytes — so a new sink needs no rebuild. The `pinned` feature embeds a
# rev-pinned copy for callers with no table of their own; `classify_with` is the
# form a walk uses once it has fetched the live one.
mitos-registry = { path = "../mitos-registry", features = ["pinned"] }

[dev-dependencies]
# `registry_drift` reads the pinned artefacts and parses a datum's own layout to
# tell the two owner shapes apart.
pallas-codec.workspace = true
pallas-primitives.workspace = true
# For `tests/registry_drift.rs` only: the DEX venue registry, checked against the
# hosted address registry beside this crate's own launchpad and lock constants.
mitos-dex-decode = { path = "../mitos-dex-decode" }
hex = { workspace = true }
