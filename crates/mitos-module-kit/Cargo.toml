[package]
name = "mitos-module-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Author-facing helpers for mitos community modules — the re-entrant scan affordance from WASM_BUDGET_CHUNKING.md."

[lints.clippy]
