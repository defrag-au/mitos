[upstream]
peer_address = "preprod-node.world.dev.cardano.org:30000"

[storage]
version = "v3"
path = "data"

[storage.state]
backend = "fjall"
cache = 200
max_history = 86400

[storage.archive]
backend = "redb"

[genesis]
byron_path = "byron.json"
shelley_path = "shelley.json"
alonzo_path = "alonzo.json"
conway_path = "conway.json"

[sync]
max_history = 604800
max_rollback = 129600

[submit]
prune_height = 200

# NOTE: mitos embeds dolos as its chain follower + state store but does
# NOT start dolos's serve stack (mitos_core::setup_domain only inits the
# follower). These [serve.*] sections are therefore VESTIGIAL — the only
# one mitos reads is [serve.minibf], and only to mount the minibf bridge
# onto mitos's OWN listener (BUNDLE_LISTEN=:8182), not to bind these
# ports. The real preprod serve ports are owned by the standalone
# dolos-preprod service. Kept here matching dolos-preprod's numbers for
# self-documentation.
[serve.grpc]
listen_address = "127.0.0.1:50052"

[serve.ouroboros]
listen_path = "dolos-preprod.socket"

[serve.minibf]
listen_address = "127.0.0.1:3100"

[serve.minikupo]
listen_address = "127.0.0.1:1443"

[serve.trp]
listen_address = "127.0.0.1:8165"

[mithril]
aggregator = "https://aggregator.release-preprod.api.mithril.network/aggregator"
genesis_key = "5b3132372c37332c3132342c3136312c362c3133372c3133312c3231332c3230372c3131372c3139382c38352c3137362c3139392c3136322c3234312c36382c3132332c3131392c3134352c31332c3233322c3234332c34392c3232392c322c3234392c3230352c3230352c33392c3233352c34345d"
# Ancillary verification key — required by dolos v1.2.0's incremental
# `cardano_database` (UTxO-HD) snapshot validation. From dolos's built-in
# KnownNetwork::CardanoPreProd default; without it bootstrap fails snapshot
# certificate validation. (preprod)
ancillary_key = "5b3138392c3139322c3231362c3135302c3131342c3231362c3233372c3231302c34352c31382c32312c3139362c3230382c3234362c3134362c322c3235322c3234332c3235312c3139372c32382c3135372c3230342c3134352c33302c31342c3232382c3136382c3132392c38332c3133362c33365d"

[chain]
type = "cardano"
magic = 1
is_testnet = true
